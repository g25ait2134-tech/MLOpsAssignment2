name: Sync Kaggle Notebooks
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4       # ✅ Fixed: was @v2
      with:
        ref: main                     # ✅ Explicitly set your target branch here

    - name: Setup Python
      uses: actions/setup-python@v5  # ✅ Fixed: was @v2
      with:
        python-version: '3.x'

    - name: Install kaggle
      run: pip install kaggle

    - name: Download Kaggle notebook
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: kaggle kernels pull shyamg25ait2134/notebook828cbfd1f6 -p .

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        # ✅ Only commits if there are actual changes
        git diff --cached --quiet || git commit -m "Update Kaggle notebooks"
        git push origin kaggle-mlops-assignment          # ✅ Explicitly push to your target branch
